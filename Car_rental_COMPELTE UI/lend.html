
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCLMR Car Rental - Lend Your Car</title>

    <style>
        /* BASIC RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b1120;
            color: #ffffff;
            min-height: 100vh;
        }

        /* NAVIGATION BAR */
        header {
            background: #111c33;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }

        .logo span {
            color: #3b82f6;
        }

        nav a {
            color: #94bdfc;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            padding: 9px 14px;
            border-radius: 5px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ffffff;
        }

        nav a.active {
            color: #3b82f6;
            border: 1px solid #294b80;
            background: #172744;
            text-decoration: none;
        }

        /* MAIN CONTAINER */
        .container {
            width: 80%;
            max-width: 820px;
            margin: 48px auto;
            background: #162238;
            padding: 35px;
            border-radius: 9px;
            border: 1px solid #263b5d;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* TITLE SECTION */
        .title-section {
            text-align: center;
            margin-bottom: 35px;
        }

        .title-section h2 {
            color: #ffffff;
            font-size: 27px;
            margin-bottom: 12px;
        }

        .title-section p {
            color: #93baff;
            font-size: 14px;
        }

        .title-section::after {
            content: "";
            display: block;
            width: 55px;
            height: 3px;
            background: #3b82f6;
            margin: 20px auto 0;
            border-radius: 5px;
        }

        /* FORM LAYOUT */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 13px;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            background: #0f192d;
            border: 1px solid #2b405f;
            border-radius: 6px;
            font-size: 13px;
            color: #ffffff;
            outline: none;
            transition: 0.3s;
        }

        input::placeholder {
            color: #7189ad;
        }

        input:focus,
        select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 4px rgba(59, 130, 246, 0.3);
        }

        select option {
            background: #162238;
            color: white;
        }

        .row {
            display: flex;
            gap: 18px;
        }

        .col {
            flex: 1;
            min-width: 0;
        }

        /* IMAGE UPLOAD */
        .image-upload {
            width: 100%;
            padding: 12px;
            background: #0f192d;
            border: 1px solid #2b405f;
            border-radius: 6px;
            color: #94bdfc;
            cursor: pointer;
        }

        .image-upload:hover {
            border-color: #3b82f6;
        }

        .image-upload::file-selector-button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 5px;
            margin-right: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .image-upload::file-selector-button:hover {
            background: #2563eb;
        }

        /* IMAGE PREVIEW */
        #imagePreview {
            display: none;
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-top: 15px;
            border: 1px solid #2b405f;
            border-radius: 6px;
            background: #0f192d;
            padding: 5px;
        }

        /* SUBMIT BUTTON */
        .btn-submit {
            background: #3b82f6;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #2563eb;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 20px;
            background: #111c33;
            color: #94bdfc;
            margin-top: 45px;
            font-size: 12px;
            border-top: 1px solid #263b5d;
        }

        /* RESPONSIVE DESIGN */
        @media(max-width: 768px) {
            .row {
                flex-direction: column;
                gap: 0;
            }

            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
                padding: 20px;
            }

            nav {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }

            nav a {
                margin: 0;
            }

            .container {
                width: 95%;
                padding: 22px;
                margin: 30px auto;
            }

            .title-section h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION BAR -->
    <header>
        <div class="logo">
            JCLMR <span>DRIVE</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="lend-car.html" class="active">Lend Your Car</a>
        </nav>
    </header>

    <!-- FORM CONTAINER -->
    <div class="container">

        <div class="title-section">
            <h2>Lend Your Car With Us</h2>
            <p>
                Want to earn extra income? Register your vehicle
                to JCLMR Car Rental today.
            </p>
        </div>

        <!-- CAR OWNER FORM -->
        <form id="lendCarForm">

            <div class="row">

                <div class="col form-group">
                    <label>Owner Full Name</label>
                    <input
                        type="text"
                        placeholder="e.g. Juan Dela Cruz"
                        required
                    >
                </div>

                <div class="col form-group">
                    <label>Contact Number</label>
                    <input
                        type="tel"
                        placeholder="e.g. 09123456789"
                        required
                    >
                </div>

            </div>

            <div class="row">

                <div class="col form-group">
                    <label>Car Brand & Model</label>
                    <input
                        type="text"
                        placeholder="e.g. Toyota Vios 2022"
                        required
                    >
                </div>

                <div class="col form-group">
                    <label>Vehicle Type</label>
                    <select required>
                        <option value="" disabled selected>
                            Select type
                        </option>
                        <option value="sedan">Sedan</option>
                        <option value="suv">SUV</option>
                        <option value="van">Van / MPV</option>
                        <option value="pickup">Pickup Truck</option>
                    </select>
                </div>

            </div>

            <div class="row">

                <div class="col form-group">
                    <label>Transmission</label>
                    <select required>
                        <option value="" disabled selected>
                            Select transmission
                        </option>
                        <option value="automatic">Automatic</option>
                        <option value="manual">Manual</option>
                    </select>
                </div>

                <div class="col form-group">
                    <label>Daily Rental Rate (₱)</label>
                    <input
                        type="number"
                        min="1"
                        placeholder="e.g. 2000"
                        required
                    >
                </div>

            </div>

            <!-- CAR IMAGE UPLOAD -->
            <div class="form-group">

                <label for="carImage">Upload Car Image</label>

                <input
                    type="file"
                    id="carImage"
                    class="image-upload"
                    accept="image/*"
                    required
                >

                <!-- IMAGE PREVIEW -->
                <img
                    id="imagePreview"
                    alt="Car Image Preview"
                >

            </div>

            <button type="submit" class="btn-submit">
                Submit Car Listing
            </button>

        </form>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        // IMAGE UPLOAD PREVIEW
        const carImage = document.getElementById("carImage");
        const imagePreview = document.getElementById("imagePreview");

        carImage.addEventListener("change", function() {

            const file = this.files[0];

            if (file) {

                if (!file.type.startsWith("image/")) {
                    alert("Please select a valid image file.");
                    this.value = "";
                    imagePreview.style.display = "none";
                    return;
                }

                const imageURL = URL.createObjectURL(file);

                imagePreview.src = imageURL;
                imagePreview.style.display = "block";

            } else {

                imagePreview.style.display = "none";

            }

        });

        // FORM SUBMISSION
        document.getElementById("lendCarForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                alert(
                    "Thank you! Your car details have been submitted successfully."
                );

                this.reset();

                imagePreview.src = "";
                imagePreview.style.display = "none";

            });

    </script>

</body>
</html>
