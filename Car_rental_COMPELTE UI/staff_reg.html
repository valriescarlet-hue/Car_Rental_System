
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCLMR - Staff Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="car-icon">👨‍💼</div>

    <h1>JCLMR</h1>
    <h2>STAFF REGISTRATION</h2>

    <p class="subtitle">
        Register a new staff member in the system.
    </p>

    <form action="#" method="post">

        <label>Staff ID</label>
        <input type="text" placeholder="Enter staff ID" required>

        <label>First Name</label>
        <input type="text" placeholder="Enter first name" required>

        <label>Last Name</label>
        <input type="text" placeholder="Enter last name" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter email address" required>

        <label>Contact Number</label>
        <input type="tel" placeholder="Enter contact number" required>

        <label>Position</label>
        <select required>
            <option value="">Select Position</option>
            <option>Manager</option>
            <option>Rental Staff</option>
            <option>Maintenance Staff</option>
            <option>Administrator</option>
        </select>

        <label>Username</label>
        <input type="text" placeholder="Create username" required>

        <label>Password</label>
        <input type="password" placeholder="Create password" required>

        <label>Confirm Password</label>
        <input type="password" placeholder="Confirm password" required>

        <button type="submit">Register Staff Account</button>

    </form>

    <p class="bottom-text">
        Already have an account?
        <a href="index.html">Back to Login</a>
    </p>

</div>

</body>
</html>
