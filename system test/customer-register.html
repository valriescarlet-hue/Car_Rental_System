
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCLMR - Customer Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="car-icon">👤</div>

    <h1>JCLMR</h1>
    <h2>CUSTOMER REGISTRATION</h2>

    <p class="subtitle">
        Create your customer account.
    </p>

    <form action="#" method="post">

        <label>First Name</label>
        <input type="text" placeholder="Enter first name" required>

        <label>Last Name</label>
        <input type="text" placeholder="Enter last name" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter email address" required>

        <label>Contact Number</label>
        <input type="tel" placeholder="Enter contact number" required>

        <label>Home Address</label>
        <input type="text" placeholder="Enter complete address" required>

        <label>Username</label>
        <input type="text" placeholder="Create username" required>

        <label>Password</label>
        <input type="password" placeholder="Create password" required>

        <label>Confirm Password</label>
        <input type="password" placeholder="Confirm password" required>

        <button type="submit">Register Customer Account</button>

    </form>

    <p class="bottom-text">
        Already have an account?
        <a href="index.html">Login here</a>
    </p>

</div>

</body>
</html>
